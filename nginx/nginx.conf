# nginx/nginx.conf
#
# Simple round-robin load balancer across 3 Node API containers.
# Free, self-hosted — no managed load balancer needed.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Sticky by client IP — a Socket.IO client's polling handshake and its
    # eventual websocket upgrade must land on the SAME backend process, or
    # the handshake fails/reconnect-loops. This is a baseline fix; see the
    # docker-compose.yml comment for the other required half (a shared
    # Socket.IO adapter so broadcasts reach clients on other replicas).
    upstream multivendor_api {
        ip_hash;
        server api1:5000;
        server api2:5000;
        server api3:5000;
    }

    # Socket.IO needs sticky-ish behavior for its handshake, and definitely
    # needs the Upgrade/Connection headers forwarded for websocket upgrade.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    client_max_body_size 55m; # matches express.json({ limit: '50mb' }) + headroom

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://multivendor_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Needed for Socket.IO (websocket upgrade)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
